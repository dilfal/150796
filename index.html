<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#CFE2FF">
  <title>Benvenuta, Rahma</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='34' fill='%23F2B84B'/%3E%3C/svg%3E">
  <script>
    // Il tema va scelto prima del primo disegno, per non lampeggiare.
    (function () {
      var scelta = "auto";
      try { scelta = localStorage.getItem("tema150796") || "auto"; } catch (e) {}
      var scuro = scelta === "scuro" || (scelta === "auto" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.setAttribute("data-tema", scuro ? "scuro" : "chiaro");
    })();
  </script>
  <style>
    /* Due temi: chiaro e scuro. Stessi nomi di colore, valori diversi. */
    :root {
      color-scheme: light;
      --alto: #CFE2FF;      /* cielo in alto */
      --basso: #FFE9D8;     /* cielo all'orizzonte */
      --ink: #0F1F2E;       /* testo sul cielo */
      --astro: #FFB94A;
      --alone: rgba(255, 170, 70, .5);
      --lontano: #A9D8C6;   /* colline lontane */
      --terra: #F6F8F3;     /* prato in primo piano */
      --luce: #12202B;      /* testo sul prato */
      --segno: #0E8A78;     /* focus e selezione */
      --stelle: 0;
      --x: .3;
      --y: .6;
    }
    :root[data-tema="scuro"] {
      color-scheme: dark;
      --alto: #090E24; --basso: #26307A; --ink: #EAF0FF;
      --astro: #F6F2E4; --alone: rgba(190, 205, 255, .38);
      --lontano: #1C2760; --terra: #090C18; --luce: #E9EEFF; --segno: #7CE3C8;
      --stelle: 1;
    }

    * { box-sizing: border-box; }
    html { background: var(--terra); }
    body {
      margin: 0;
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .cielo {
      position: fixed; inset: 0;
      background: linear-gradient(to bottom, var(--alto) 0%, var(--basso) 85%);
      z-index: -1;
    }
    .stelle { position: absolute; inset: 0 0 35% 0; opacity: var(--stelle); transition: opacity 1.5s; }
    .stelle i { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff; }

    .pagina { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; }
    .colonna { width: min(36rem, 100% - 3rem); margin-inline: auto; }

    /* Saluto */
    .saluto { padding-top: clamp(2rem, 7vh, 5rem); }
    h1 {
      margin: 0;
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
      font-weight: 500;
      font-size: clamp(2.5rem, 10vw, 4.5rem);
      line-height: 1.02;
      letter-spacing: -.015em;
    }
    .frase { margin: 1rem 0 0; font-size: 1.05rem; line-height: 1.55; max-width: 28ch; opacity: .85; }

    /* Scena: qui viaggia il sole (o la luna) */
    .scena { position: relative; flex: 1; min-height: clamp(8rem, 22vh, 24rem); }
    .astro {
      --d: clamp(64px, 11vw, 120px);
      --col: clamp(70px, 15vw, 150px);
      position: absolute; z-index: 1;
      width: var(--d); height: var(--d);
      left: calc((100% - var(--d)) * var(--x));
      /* y = 0: quasi nascosto dietro le colline; y = 1: in cima alla scena */
      bottom: calc(var(--col) * .55 - var(--d) * .9 + var(--y) * (100% - var(--d) - 1rem - var(--col) * .55 + var(--d) * .9));
      transition: left 2.6s cubic-bezier(.2, .7, .2, 1), bottom 2.6s cubic-bezier(.2, .7, .2, 1);
    }
    .astro svg { width: 100%; height: 100%; display: block; overflow: visible; }
    .astro .alone { fill: url(#alone); }
    .astro .corpo { fill: var(--astro); }
    .astro[data-corpo="sole"] .luna, .astro[data-corpo="luna"] .sole { display: none; }
    .colline { position: absolute; z-index: 2; left: 0; bottom: -1px; width: 100%; height: clamp(70px, 15vw, 150px); fill: var(--lontano); display: block; }

    /* Prato e collegamenti */
    .terra { position: relative; z-index: 3; background: var(--terra); color: var(--luce); padding-bottom: max(2rem, env(safe-area-inset-bottom)); }
    .onda { position: absolute; left: 0; top: -39px; width: 100%; height: 40px; fill: var(--terra); display: block; }
    .elenco { list-style: none; margin: 0 auto; padding: .25rem 0 0; }
    .elenco li + li { border-top: 1px solid color-mix(in srgb, var(--luce) 18%, transparent); }
    .elenco a {
      display: flex; align-items: center; gap: 1.1rem;
      min-height: 4.5rem; padding: .75rem .25rem;
      color: inherit; text-decoration: none;
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
      font-size: 1.6rem; line-height: 1.1;
      border-radius: 10px;
      transition: background .2s;
    }
    .elenco a:hover { background: color-mix(in srgb, var(--luce) 8%, transparent); }
    .elenco a:focus-visible { outline: 3px solid var(--segno); outline-offset: 2px; }
    .elenco .icona { width: 1.9rem; height: 1.9rem; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .elenco .vai { margin-left: auto; width: 1.1rem; height: 1.1rem; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; opacity: .55; transition: transform .2s, opacity .2s; }
    .elenco a:hover .vai { transform: translateX(4px); opacity: 1; }
    .piede { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .75rem 1rem; margin-top: 1.25rem; }
    .ora { margin: 0; font-size: .9rem; opacity: .7; font-variant-numeric: tabular-nums; }
    .aspetto { display: inline-flex; border: 1px solid color-mix(in srgb, var(--luce) 28%, transparent); border-radius: 999px; padding: 3px; }
    .aspetto button {
      font: inherit; font-size: .88rem; color: inherit; background: none; border: 0; cursor: pointer;
      min-height: 2.25rem; padding: 0 .95rem; border-radius: 999px;
    }
    .aspetto button:hover { background: color-mix(in srgb, var(--luce) 10%, transparent); }
    .aspetto button[aria-pressed="true"] { background: var(--luce); color: var(--terra); }
    .aspetto button:focus-visible { outline: 3px solid var(--segno); outline-offset: 2px; }

    @media (prefers-reduced-motion: reduce) {
      .astro, .stelle, .elenco a, .elenco .vai { transition: none; }
    }
  </style>
</head>
<body>
  <div class="cielo" aria-hidden="true"><div class="stelle" id="stelle"></div></div>

  <div class="pagina">
    <header class="colonna saluto">
      <h1><span id="saluto">Buongiorno</span>,<br>Rahma</h1>
      <p class="frase" id="frase">Spero che la giornata inizi nel modo migliore.</p>
    </header>

    <div class="scena" aria-hidden="true">
      <div class="astro" id="astro" data-corpo="sole">
        <svg width="0" height="0" style="position:absolute"><defs><radialGradient id="alone"><stop offset="0%" style="stop-color:var(--alone);stop-opacity:.9"/><stop offset="35%" style="stop-color:var(--alone);stop-opacity:.5"/><stop offset="70%" style="stop-color:var(--alone);stop-opacity:.14"/><stop offset="100%" style="stop-color:var(--alone);stop-opacity:0"/></radialGradient></defs></svg>
        <svg class="sole" viewBox="0 0 100 100"><circle class="alone" cx="50" cy="50" r="50"/><circle class="corpo" cx="50" cy="50" r="32"/></svg>
        <svg class="luna" viewBox="0 0 100 100">
          <defs><mask id="falce"><rect width="100" height="100" fill="#fff"/><circle cx="64" cy="42" r="29" fill="#000"/></mask></defs>
          <circle class="alone" cx="50" cy="50" r="50"/>
          <circle class="corpo" cx="50" cy="50" r="34" mask="url(#falce)"/>
        </svg>
      </div>
      <svg class="colline" viewBox="0 0 1440 150" preserveAspectRatio="none"><path d="M0 150V90C140 40 260 30 400 70S640 120 800 70 1100 10 1260 50 1390 80 1440 60V150Z"/></svg>
    </div>

    <section class="terra">
      <svg class="onda" viewBox="0 0 1440 40" preserveAspectRatio="none" aria-hidden="true"><path d="M0 40V22C200 4 420 6 640 20S1060 34 1240 16 1400 8 1440 14V40Z"/></svg>
      <nav class="colonna" aria-label="I miei spazi">
        <ul class="elenco">
          <li><a href="https://bonaccia.150796.xyz/">
            <svg class="icona" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9c3-3.5 6-3.5 9 0s6 3.5 9 0"/><path d="M3 15c3-3.5 6-3.5 9 0s6 3.5 9 0"/></svg>
            Bonaccia
            <svg class="vai" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></a></li>
          <li><a href="https://sakina.150796.xyz/">
            <svg class="icona" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19C5 10 10 5 19 4c0 9-5 14-14 15z"/><path d="M5 19l9-9"/></svg>
            Sakina
            <svg class="vai" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></a></li>
          <li><a href="https://diario-get.150796.xyz/">
            <svg class="icona" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3v18"/><path d="M12.5 8h3M12.5 12h3"/></svg>
            Diario GET
            <svg class="vai" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></a></li>
          <li><a href="https://marsa.150796.xyz/">
            <svg class="icona" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 4.5A6.5 6.5 0 1 0 19.5 14 5.3 5.3 0 0 1 17 4.5z"/><path d="M3 20c2-1.6 4-1.6 6 0s4 1.6 6 0 4-1.6 6 0"/></svg>
            Marsa
            <svg class="vai" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></a></li>
        </ul>
        <div class="piede">
          <p class="ora" id="ora"></p>
          <div class="aspetto" role="group" aria-label="Aspetto della pagina">
            <button type="button" data-tema="auto" aria-pressed="false">Auto</button>
            <button type="button" data-tema="chiaro" aria-pressed="false">Chiaro</button>
            <button type="button" data-tema="scuro" aria-pressed="false">Scuro</button>
          </div>
        </div>
      </nav>
    </section>
  </div>

  <script>
    // Fasce orarie: da (ora d'inizio), id, saluto, frase
    var FASCE = [
      { da: 5,  id: "mattina",    saluto: "Buongiorno",      frase: "Spero che la giornata inizi nel modo migliore." },
      { da: 13, id: "pomeriggio", saluto: "Buon pomeriggio", frase: "Un benvenuto speciale per il tuo pomeriggio." },
      { da: 18, id: "sera",       saluto: "Buonasera",       frase: "Mettiti comoda, la serata è tua." },
      { da: 22, id: "notte",      saluto: "Buonanotte",      frase: "Ti auguro una notte serena." }
    ];

    function fasciaPer(ora) {
      if (ora >= 22 || ora < 5) return FASCE[3];
      for (var i = FASCE.length - 2; i >= 0; i--) {
        if (ora >= FASCE[i].da) return FASCE[i];
      }
      return FASCE[0];
    }

    // Stelle: posizioni fisse (stesso cielo a ogni visita)
    (function () {
      var box = document.getElementById("stelle"), seme = 7, html = "";
      function caso() { seme = (seme * 16807) % 2147483647; return seme / 2147483647; }
      for (var i = 0; i < 46; i++) {
        var s = 2 + Math.round(caso() * 1.5);
        html += '<i style="left:' + (caso() * 100).toFixed(1) + '%;top:' + (caso() * 100).toFixed(1) + '%;width:' + s + 'px;height:' + s + 'px;opacity:' + (0.55 + caso() * 0.45).toFixed(2) + '"></i>';
      }
      box.innerHTML = html;
    })();

    var COLORI_BARRA = { chiaro: "#CFE2FF", scuro: "#090E24" };
    var astro = document.getElementById("astro");
    var radice = document.documentElement;
    var mq = window.matchMedia ? matchMedia("(prefers-color-scheme: dark)") : null;

    function sceltaSalvata() {
      try { return localStorage.getItem("tema150796") || "auto"; } catch (e) { return "auto"; }
    }
    function applicaTema() {
      var scelta = sceltaSalvata();
      var scuro = scelta === "scuro" || (scelta === "auto" && mq && mq.matches);
      var tema = scuro ? "scuro" : "chiaro";
      radice.setAttribute("data-tema", tema);
      document.querySelector('meta[name="theme-color"]').setAttribute("content", COLORI_BARRA[tema]);
      var bottoni = document.querySelectorAll(".aspetto button");
      for (var i = 0; i < bottoni.length; i++) {
        bottoni[i].setAttribute("aria-pressed", bottoni[i].getAttribute("data-tema") === scelta ? "true" : "false");
      }
      astro.setAttribute("data-corpo", scuro ? "luna" : "sole");
      posiziona();
    }
    function scegli(scelta) {
      try { localStorage.setItem("tema150796", scelta); } catch (e) {}
      applicaTema();
    }
    var tasti = document.querySelectorAll(".aspetto button");
    for (var k = 0; k < tasti.length; k++) {
      tasti[k].addEventListener("click", function () { scegli(this.getAttribute("data-tema")); });
    }
    if (mq && mq.addEventListener) mq.addEventListener("change", applicaTema);

    // Il sole va da sinistra a destra dalle 6 alle 20, la luna dalle 20 alle 6.
    // Se il corpo scelto dal tema non è "di turno" (sole di notte, luna di giorno) resta alto nel cielo.
    function posiziona() {
      var adesso = new Date();
      var h = adesso.getHours() + adesso.getMinutes() / 60;
      var giorno = h >= 6 && h < 20;
      var corpoSole = astro.getAttribute("data-corpo") === "sole";
      var t = 0.5;
      if (corpoSole && giorno) t = (h - 6) / 14;
      if (!corpoSole && !giorno) t = (h >= 20 ? h - 20 : h + 4) / 10;
      astro.style.setProperty("--x", (0.08 + 0.84 * t).toFixed(3));
      astro.style.setProperty("--y", Math.sin(Math.PI * t).toFixed(3));
    }

    function aggiorna() {
      var adesso = new Date();
      var f = fasciaPer(adesso.getHours());
      document.getElementById("saluto").textContent = f.saluto;
      document.getElementById("frase").textContent = f.frase;
      document.getElementById("ora").textContent = adesso.toLocaleString("it-IT", {
        weekday: "long", day: "numeric", month: "long", hour: "2-digit", minute: "2-digit"
      });
      applicaTema();
    }

    // All'apertura l'astro parte sotto le colline e sale al suo posto.
    astro.style.setProperty("--y", "0");
    aggiorna();
    var arrivo = astro.style.getPropertyValue("--y");
    astro.style.setProperty("--y", "0");
    requestAnimationFrame(function () { requestAnimationFrame(function () { astro.style.setProperty("--y", arrivo); }); });
    setInterval(aggiorna, 30000);
  </script>
</body>
</html>
